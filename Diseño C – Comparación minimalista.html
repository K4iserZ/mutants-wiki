<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diseño C – Comparación minimalista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ===== 0) TOKENS: claro por defecto, oscuro automático ===== */
:root{--bg:#f4f2ee;--card:#fffdf9;--txt:#1b1b1f;--mut:#8a8a93;--line:#e8e4dc;--line2:#cdc8be;--track:#ebe7df;--soft:#f3f0ea;--leg:#7c3aed;--hero:#b7791f;--star:#d99a14;
  /* FUENTES: cambia aquí para probar otras (deben estar en el <link> de Google Fonts) */
  --f-name:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-num:"Manrope","Helvetica Neue",Arial,sans-serif;
  --c-green:#16a34a;--c-sky:#0ea5e9;--c-blue:#2563eb;--c-amber:#d97706;--c-red:#dc2626;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0d11;--card:#16161c;--txt:#f1f0ec;--mut:#8b8b96;--line:#25252d;--line2:#3a3a45;--track:#25252d;--soft:#1e1e26;--leg:#b794f4;--hero:#e6c15a;--star:#f2c23a;
  --c-green:#4ade80;--c-sky:#5fd0ff;--c-blue:#6ea2ff;--c-amber:#ffb347;--c-red:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0d0d11;--card:#16161c;--txt:#f1f0ec;--mut:#8b8b96;--line:#25252d;--line2:#3a3a45;--track:#25252d;--soft:#1e1e26;--leg:#b794f4;--hero:#e6c15a;--star:#f2c23a;
  --c-green:#4ade80;--c-sky:#5fd0ff;--c-blue:#6ea2ff;--c-amber:#ffb347;--c-red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-num);padding:20px 12px 40px}

/* Panel de pruebas (no forma parte del diseño) */
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin:0 auto 10px;font-size:12px;color:var(--mut)}
.tools b{color:var(--txt)}
.tools label{display:flex;gap:5px;align-items:center}
.tools input{width:100px;padding:5px 7px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--txt)}
.tools button{padding:6px 10px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--txt);cursor:pointer}
.tools button.on{background:var(--txt);color:var(--card);border-color:var(--txt)}

/* ===== 1) ESCENARIO ===== */
.stage{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-start;margin-top:18px}

/* ===== 2) TARJETA: solo un color de acento por tipo ===== */
.card[data-type="legendary"]{--a:var(--leg)}
.card[data-type="heroic"]{--a:var(--hero)}
.card{width:248px;background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 14px 34px #0000001f;overflow:hidden}

/* ===== 3) IMAGEN DE CUERPO COMPLETO ===== */
.hero{position:relative;height:222px;background:radial-gradient(70% 60% at 50% 88%,color-mix(in srgb,var(--a) 24%,transparent),transparent 72%)}
.art{position:absolute;inset:10px 0 46px 0;display:flex;align-items:flex-end;justify-content:center;font-size:130px;line-height:1;filter:drop-shadow(0 8px 8px #0000004d)}
.art img{max-width:100%;max-height:100%;object-fit:contain}
.art.flip{transform:scaleX(-1)}

/* ===== 4) SELECTOR DE ESTRELLA / SKIN (esquina superior derecha): al elegir una, se actualiza toda la tarjeta ===== */
.skins{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.skin{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--card);color:var(--mut);box-shadow:0 0 0 1px var(--line2);display:flex;align-items:center;justify-content:center;font:800 10px var(--f-num);overflow:hidden;opacity:.85;transition:transform .15s,box-shadow .15s}
.skin img{width:100%;height:100%;object-fit:contain}
.skin.on{opacity:1;color:var(--a);box-shadow:0 0 0 2px var(--a),0 3px 8px #00000040;transform:scale(1.08)}

/* ===== 5) CABECERA: NOMBRE, tipo, NIVEL y genes ===== */
.head{text-align:center;padding:2px 14px 6px}
.name{height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--f-name);font-weight:600;line-height:1.05;letter-spacing:.05em;text-transform:uppercase}   /* alto fijo: todas las tarjetas quedan alineadas */
.name .nm{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-align:center}
.name .nm.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}   /* nombre muy largo: 2 líneas con puntos suspensivos */
.dot{display:none;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
body[data-pal="mutant"] .dot{display:inline-block}
.meta{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2px;font-size:12px;color:var(--mut);letter-spacing:.04em}
.type{display:inline-flex;align-items:center;gap:6px;color:var(--a);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.type svg,.type img{width:18px;height:18px;object-fit:contain}
.genes{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:9px;justify-content:center}   /* GENES del personaje: abajo al centro de la imagen */
.gicon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1.5px var(--a),0 3px 8px #00000040}
.gicon img{width:100%;height:100%;object-fit:contain}

/* ===== 6) ORBES: cada ranura = imagen de fondo + imagen del orbe encima (1 a 4). Clic = cambia de orbe ===== */
.orbs{display:flex;gap:8px;justify-content:center;padding:2px 0 10px}
.orb{position:relative;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--oc,var(--line2));background:var(--soft) center/contain no-repeat;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--txt)}
.orb.empty{border-style:dashed;color:var(--mut)}
.orb.bg{border:0;background-color:transparent}      /* con imagen de fondo no se dibuja el aro */
.oi{width:66%;height:66%;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.oi img{width:100%;height:100%;object-fit:contain}
.orb.bg .plus{display:none}

/* ===== 7) FILAS DE STATS: líneas finas, sin cajas ===== */
.rows{padding:0 14px 6px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;row-gap:2px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row.gene{grid-template-columns:28px minmax(0,1fr) 70px}
.ico{grid-row:1/4;grid-column:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--soft);box-shadow:0 0 0 1px var(--line2)}
.ico img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.top{grid-column:2;grid-row:1;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);white-space:nowrap}
.tag{color:var(--a);letter-spacing:.02em}                 /* bonus de orbes */
.d{flex:1;min-width:0;text-align:right;letter-spacing:.02em;text-transform:none;color:var(--cc,var(--mut))}   /* diferencia */
.rk{width:14px;height:14px;border-radius:50%;font-size:9px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--card);flex:none}
.fit{display:block;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.v{grid-column:2;grid-row:2;font-size:19px;font-weight:600;letter-spacing:-.02em}   /* VALOR principal */
.bar{grid-column:2;grid-row:3;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:var(--p);border-radius:2px;background:var(--cc,var(--mut))}
/* HABILIDAD: a la derecha del ataque. No se compara */
.skill{grid-column:3;grid-row:1/4;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0;padding-left:10px;border-left:1px solid var(--line);color:var(--mut)}
.sico{font-size:14px;line-height:1}
.sico img{width:16px;height:16px;object-fit:contain}
.sv{width:100%;text-align:right;font-size:13px;font-weight:600;color:var(--txt)}

/* ===== 8) COMPARACIÓN: el color sale de JS (--cc) por RANKING o por MUTANTE ===== */
body[data-cmp="off"] .d,body[data-cmp="off"] .rk{display:none}
body[data-cmp="off"] .bar i{background:var(--mut)}
</style>
</head>
<body data-cmp="on" data-pal="rank">
<div class="tools" id="inputs"></div>
<div class="tools">
  <button id="bNorm">Normales</button>
  <button id="bBig">Mutante 1: grandes (100M / 2M)</button>
  <button id="bHuge">Mutante 1: enormes (165B)</button>
  <button id="bLong">Nombre largo</button>
  <button id="gen2" class="on">Mutante 2: 2 genes</button>
  <button id="gen1">Mutante 2: 1 gen</button>
</div>
<div class="tools">
  <span>Mutantes:</span>
  <button class="cnt on" data-n="2">2</button><button class="cnt" data-n="3">3</button><button class="cnt" data-n="4">4</button><button class="cnt" data-n="5">5</button>
  <span>|</span>
  <button id="pRank" class="on">Colores: ranking</button><button id="pMut">Colores: por mutante</button>
  <span>|</span>
  <button id="oOn" class="on">Orbes: aplicar</button><button id="oOff">Orbes: ignorar</button>
  <span>|</span>
  <button id="cOn" class="on">Comparar</button><button id="cOff">Sin comparar</button>
</div>
<div class="stage" id="root"></div>

<script>
/* =====================================================================
   1) DATOS: lo único que debes llenar por cada mutante (igual que el diseño B)
   ---------------------------------------------------------------------
   name   NOMBRE            type   "legendary" | "heroic"
   img    URL de la IMAGEN DE CUERPO COMPLETO (PNG sin fondo). Vacío = emoji de "emoji"
   flip   true = voltea la imagen
   skin   índice de la skin/estrella activa (0 = la primera)
   skins  [{icon,label,...campos}] SELECTOR de estrella/skin. icon = imagen/emoji/texto del chip.
          Los campos que pongas en una skin (img, emoji, flip, level, hp, speed, geneIcons, attacks) REEMPLAZAN a los base
          al seleccionarla; lo que no pongas se hereda. Con 0 o 1 skins el selector no aparece
   level  VALOR del nivel   hp  VALOR de vida   speed  VALOR de velocidad
   slots  RANURAS de orbes (1 a 4)   orbs  ORBE por ranura (id de ORB_CATALOG o null)
   geneIcons  1 o 2 ÍCONOS de los GENES del personaje (abajo al centro de la imagen)
   attacks    SIEMPRE 2 ataques, sin importar cuántos genes tenga el personaje. Cada uno:
              icon   ÍCONO del ATAQUE (URL/emoji). "neutral" = ataque neutro (usa ICONS.neutral)
              atk    VALOR del ataque
              skill  "buff" | "shield" | "none"  -> ÍCONO de la habilidad
              val    VALOR de la habilidad
   Los valores se escriben SIN orbes; el diseño aplica sus bonus.
   ===================================================================== */
const mutants=[
 {name:"Llama Inca",type:"legendary",img:"",emoji:"🦙",flip:false,skin:0,
  skins:[{icon:"1★",label:"Estrella 1 (base)"},{icon:"2★",label:"Estrella 2",hp:46200,speed:7.1,attacks:[{atk:20100},{atk:32500}]},{icon:"3★",label:"Estrella 3",level:110,hp:55000,speed:7.6,attacks:[{atk:24000,val:7400},{atk:36000,val:11800}]}],
  hp:40526,speed:6.67,level:100,slots:4,orbs:["fire","life","arcane",null],geneIcons:["🐾","🌀"],
  attacks:[{icon:"🐾",atk:17920,skill:"buff",val:6272},{icon:"🔥",atk:29038,skill:"buff",val:10163}]},
 {name:"Cyber Hero",type:"heroic",img:"",emoji:"🦾",flip:true,skin:0,
  skins:[{icon:"1★",label:"Base"},{icon:"2★",label:"Estrella 2",emoji:"🤖",hp:26000,speed:8.9,attacks:[{atk:19800},{atk:17200}]}],
  hp:21081,speed:8.33,level:100,slots:3,orbs:["wind",null,null],geneIcons:["⚡","✴️"],
  attacks:[{icon:"⚡",atk:16677,skill:"shield",val:5837},{icon:"💠",atk:14497,skill:"shield",val:5074}]},
 {name:"Lobo Gélido",type:"heroic",img:"",emoji:"🐺",flip:false,skin:0,
  skins:[{icon:"1★"},{icon:"2★",hp:38500,attacks:[{atk:23900},{atk:14600}]}],
  hp:33800,speed:7.5,level:100,slots:2,orbs:["wind","star"],geneIcons:["❄️","🧊"],
  attacks:[{icon:"❄️",atk:21400,skill:"shield",val:7020},{icon:"🧊",atk:12950,skill:"shield",val:4310}]},
 {name:"Mantis Solar",type:"legendary",img:"",emoji:"🦗",flip:false,skin:0,
  hp:52100,speed:5.9,level:100,slots:4,orbs:["life","life",null,null],geneIcons:["☀️","🔆"],
  attacks:[{icon:"☀️",atk:25800,skill:"buff",val:8800},{icon:"🌟",atk:9800,skill:"buff",val:3900}]},
 {name:"Draco Ígneo",type:"heroic",img:"",emoji:"🐉",flip:false,skin:0,       // 1 solo gen, pero su 2º ataque existe (neutro)
  skins:[{icon:"1★"},{icon:"2★",hp:31000,attacks:[{atk:34000},{atk:9200}]}],
  hp:27300,speed:9.1,level:100,slots:1,orbs:["fire"],geneIcons:["🔥"],
  attacks:[{icon:"🔥",atk:30500,skill:"shield",val:11200},{icon:"neutral",atk:8400,skill:"shield",val:2900}]}
];

/* 2) ÍCONOS FIJOS (emoji o URL de imagen) */
const ICONS={hp:"➕",speed:"💨",skill:{buff:"⬆",shield:"🛡",none:"–"},
  neutral:"⚪",                              // ÍCONO del ataque neutro (cuando un ataque no tiene gen)
  orbSlot:"",                                // IMAGEN DE FONDO de cada ranura de orbe (URL, o lista [url1,url2,...] una por ranura). Vacío = aro dibujado
 
  badge:{legendary:"",heroic:""}};          // LOGO de tipo (URL de imagen). Vacío = ícono dibujado de abajo
const TYPE_SVG={                           // ícono provisional de cada tipo (usa el color de acento)
  legendary:`<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="currentColor"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="var(--card)" stroke-width="1" stroke-linejoin="round"/></svg>`,
  heroic:`<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/><path d="M12 7l1.6 3.4 3.7.4-2.8 2.5.8 3.6L12 15l-3.3 1.9.8-3.6-2.8-2.5 3.7-.4z" fill="var(--card)"/></svg>`
};
const SKILL_NAMES={buff:"Fortalecer",shield:"Escudo",none:"Sin habilidad"};

/* 2b) CATÁLOGO DE ORBES: icon, color del aro y bonus en % (hp, atk, skill, speed) */
const ORB_CATALOG={
  life:  {icon:"💚",name:"Orbe de vida",  color:"#3ddc84",bonus:{hp:15}},
  fire:  {icon:"🔥",name:"Orbe de fuego", color:"#ff7a3d",bonus:{atk:10}},
  wind:  {icon:"🌪️",name:"Orbe de viento",color:"#5fd0ff",bonus:{speed:8}},
  arcane:{icon:"🔮",name:"Orbe arcano",   color:"#b06bff",bonus:{skill:12}},
  star:  {icon:"⭐",name:"Orbe estelar",  color:"#f2c23a",bonus:{hp:5,atk:5,speed:5,skill:5}}
};
const ORB_IDS=[null,...Object.keys(ORB_CATALOG)];
let useOrbs=true;
const normalize=m=>{m.orbs=Array.from({length:m.slots},(_,i)=>(m.orbs&&m.orbs[i])||null)};

/* 3a) SKIN ACTIVA: devuelve el mutante con los campos de su skin/estrella aplicados */
const cur=m=>{const s=(m.skins&&m.skins[m.skin||0])||{};
  return {...m,...s,geneIcons:s.geneIcons||m.geneIcons,attacks:m.attacks.map((a,i)=>({...a,...((s.attacks||[])[i]||{})}))}};

/* 3) STATS FINALES = base (de la skin activa) + bonus de orbes */
const LOWER_IS_BETTER=[];
const baseOf={hp:m=>cur(m).hp,speed:m=>cur(m).speed,atk0:m=>cur(m).attacks[0].atk,atk1:m=>cur(m).attacks[1].atk,skill0:m=>cur(m).attacks[0].val,skill1:m=>cur(m).attacks[1].val};
const groupOf=k=>k.startsWith("atk")?"atk":k.startsWith("skill")?"skill":k;
const bonusPct=(m,k)=>useOrbs?m.orbs.reduce((t,id)=>t+((id&&ORB_CATALOG[id].bonus[groupOf(k)])||0),0):0;
function stat(key,m){const b=baseOf[key](m);if(b==null)return null;const v=b*(1+bonusPct(m,key)/100);return key==="speed"?Math.round(v*100)/100:Math.round(v)}
const f=n=>n.toLocaleString("en-US");
const fv=(key,n)=>key==="speed"?n.toFixed(2):f(n);

/* 3b) COLORES DE COMPARACIÓN (2 a 5 mutantes). Nombres = variables --c-* del tema claro/oscuro
   "ranking": 1º verde · 2º celeste · 3º azul · 4º ámbar · último rojo (empate = mismo color; todos iguales = sin color)
   "mutante": cada mutante conserva su color */
const RANK_COLORS={2:["green","red"],3:["green","sky","red"],4:["green","sky","blue","red"],5:["green","sky","blue","amber","red"]};
const MUTANT_COLORS=["red","sky","blue","green","amber"];
let COUNT=2,PAL="rank";
const shown=()=>mutants.slice(0,COUNT);
function info(key,m){                                 // posición, color, barra y diferencia (líder: + sobre el 2º; otros: − al líder)
  const mine=stat(key,m),vals=shown().map(x=>stat(key,x)).filter(v=>v!=null);
  if(mine==null||vals.length<2)return{c:null,rank:0,pct:100,d:""};
  const sc=v=>LOWER_IS_BETTER.includes(key)?-v:v,best=a=>a.reduce((x,y)=>sc(y)>sc(x)?y:x);
  const rank=1+vals.filter(v=>sc(v)>sc(mine)).length,allEq=vals.every(v=>v===vals[0]);
  const pal=RANK_COLORS[Math.min(vals.length,5)];
  const c=PAL==="mutant"?MUTANT_COLORS[mutants.indexOf(m)]:(allEq?null:pal[Math.min(rank,pal.length)-1]);
  const rest=vals.slice();rest.splice(rest.indexOf(mine),1);
  const diff=mine-(rank===1?best(rest):best(vals));
  return{c,rank,pct:Math.max(6,mine/(Math.max(...vals)||1)*100),d:diff===0?"=":(diff>0?"+":"−")+fv(key,Math.abs(diff))};
}

/* 4) UTILIDADES */
const isUrl=s=>/^(https?:|\/|data:)/.test(s);
const icon=x=>isUrl(x)?`<img src="${x}" alt="">`:x;

/* =====================================================================
   5) PARTES DE LA TARJETA (una función = un bloque visual)
   ===================================================================== */
// FILA: ÍCONO + etiqueta (+ bonus de orbes, posición, diferencia) + VALOR final + barra. Con "skill": HABILIDAD a la derecha
function row({key,ic,label,m,skill}){
  const I=info(key,m),bp=bonusPct(m,key),col=I.c?`var(--c-${I.c})`:"";
  const rk=shown().length>2&&I.rank?`<i class="rk" style="background:${col||"var(--mut)"}">${I.rank}</i>`:"";
  const tag=bp?`<span class="tag" title="Bonus de orbes">+${bp}%</span>`:"";
  const sk=skill?`<div class="skill" title="${skill.name}${skill.bp?" (+"+skill.bp+"% orbes)":""}"><div class="sico">${icon(skill.ic)}</div><div class="fit sv" data-max="13">${f(skill.value)}</div></div>`:"";
  return `<div class="row ${skill?"gene":""}" style="--p:${I.pct}%;${col?"--cc:"+col:""}">
    <div class="ico">${icon(ic)}</div>
    <div class="top"><span>${label}</span>${tag}${rk}<span class="fit d" data-max="11">${I.d}</span></div>
    <div class="fit v" data-max="19">${fv(key,stat(key,m))}</div>
    <div class="bar"><i></i></div>${sk}</div>`;
}
const parts={
  // IMAGEN DE CUERPO COMPLETO del personaje
  art:m=>{const e=cur(m);return `<div class="art ${e.flip?"flip":""}">${e.img?`<img src="${e.img}" alt="${e.name}">`:e.emoji}</div>`},
  // SELECTOR de estrella / skin: un chip por skin (solo si hay 2 o más)
  skins:m=>!m.skins||m.skins.length<2?"":`<div class="skins">${m.skins.map((k,i)=>`<button class="skin ${i===(m.skin||0)?"on":""}" data-i="${i}" title="${k.label||"Skin "+(i+1)}">${icon(k.icon||"★")}</button>`).join("")}</div>`,
  // NOMBRE + LOGO de tipo + NIVEL
  head:m=>{const e=cur(m);return `<div class="head"><div class="name"><i class="dot" style="background:var(--c-${MUTANT_COLORS[mutants.indexOf(m)]})"></i><span class="nm">${e.name}</span></div>
    <div class="meta"><span class="type">${ICONS.badge[m.type]?icon(ICONS.badge[m.type]):TYPE_SVG[m.type]}${m.type}</span><span>·</span><span>Level ${e.level}</span></div></div>`},
  // GENES del personaje (1 o 2): abajo al centro de la imagen
  genes:m=>`<div class="genes">${cur(m).geneIcons.map(g=>`<div class="gicon" title="Gen">${icon(g)}</div>`).join("")}</div>`,
  // ORBES: cada ranura = IMAGEN DE FONDO (ICONS.orbSlot) + IMAGEN DEL ORBE encima. Clic = cambia de orbe
  orbs:m=>`<div class="orbs">${m.orbs.map((id,i)=>{
      const o=id&&ORB_CATALOG[id],bg=Array.isArray(ICONS.orbSlot)?ICONS.orbSlot[i]:ICONS.orbSlot;
      const tip=o?o.name+": "+Object.entries(o.bonus).map(([k,v])=>k+" +"+v+"%").join(", "):"Ranura vacía (clic para agregar)";
      const st=(o?`--oc:${o.color};`:"")+(bg?`background-image:url(${bg});`:"");
      return `<button class="orb ${o?"":"empty"} ${bg?"bg":""}" data-i="${i}" title="${tip}" style="${st}"><span class="oi ${o?"":"plus"}">${o?icon(o.icon):"+"}</span></button>`}).join("")}</div>`,
  hp:m=>row({key:"hp",ic:ICONS.hp,label:"Vida",m}),
  // ATAQUE i (siempre 2): ÍCONO + VALOR (se compara) con su HABILIDAD (ÍCONO + VALOR) a la derecha, sin comparar
  attack:(m,i)=>{const a=cur(m).attacks[i],sk=a.skill||"none";return row({key:"atk"+i,ic:(!a.icon||a.icon==="neutral")?ICONS.neutral:a.icon,label:"Ataque "+(i+1),m,
      skill:{ic:ICONS.skill[sk],name:SKILL_NAMES[sk],value:stat("skill"+i,m),bp:bonusPct(m,"skill"+i)}})},
  speed:m=>row({key:"speed",ic:ICONS.speed,label:"Velocidad",m})
};
function render(m){
  normalize(m);
  const el=document.createElement("div");
  el.className="card";el.dataset.type=m.type;
  el.innerHTML=`<div class="hero">${parts.art(m)}${parts.genes(m)}${parts.skins(m)}</div>${parts.head(m)}${parts.orbs(m)}
    <div class="rows">${parts.hp(m)}${cur(m).attacks.map((_,i)=>parts.attack(m,i)).join("")}${parts.speed(m)}</div>`;
  el.querySelectorAll(".skin").forEach(b=>b.onclick=()=>{m.skin=+b.dataset.i;draw();sync()});   // elegir skin = actualizar todo
  el.querySelectorAll(".orb").forEach(h=>h.onclick=()=>{const i=+h.dataset.i;m.orbs[i]=ORB_IDS[(ORB_IDS.indexOf(m.orbs[i])+1)%ORB_IDS.length];draw();sync()});
  return el;
}

/* 6) AJUSTE: los números siempre se muestran completos; si no caben, se achica la letra */
const MIN_FONT=7;
function fit(card){
  const nm=card.querySelector(".nm");                  // NOMBRE: se achica hasta 15px; si aún no cabe, 2 líneas
  if(nm){nm.classList.remove("wrap");let z=26;nm.style.fontSize=z+"px";
    while(z>15&&nm.scrollWidth>nm.clientWidth+.5){z-=1;nm.style.fontSize=z+"px"}
    if(nm.scrollWidth>nm.clientWidth+.5){nm.classList.add("wrap");nm.style.fontSize="15px"}}
  card.querySelectorAll(".fit").forEach(el=>{
  let s=+el.dataset.max;el.style.fontSize=s+"px";
  while(s>MIN_FONT&&el.scrollWidth>el.clientWidth+.5){s-=.5;el.style.fontSize=s+"px"}
})}

/* 7) DIBUJO + PANEL DE PRUEBAS */
const root=document.getElementById("root");
function draw(){root.replaceChildren(...shown().map(render));root.querySelectorAll(".card").forEach(fit)}
const ORIG=JSON.parse(JSON.stringify(mutants));
const FIELDS=[["sl","Ranuras",m=>m.slots,(m,x)=>{m.slots=Math.min(4,Math.max(1,x));normalize(m)}],["hp","Vida",m=>m.hp,(m,x)=>m.hp=x],["atk","Ataque 1",m=>m.attacks[0].atk,(m,x)=>m.attacks[0].atk=x],["sk","Habilidad 1",m=>m.attacks[0].val,(m,x)=>m.attacks[0].val=x]];
const box=document.getElementById("inputs");
function buildInputs(){
  box.replaceChildren();
  shown().forEach(m=>{
    const g=document.createElement("div");g.style.cssText="display:flex;gap:6px;flex-wrap:wrap;align-items:center";
    g.innerHTML=`<b>${m.name}:</b>`+FIELDS.map(([k,l])=>`<label>${l} <input type="number" min="${k==='sl'?1:0}" max="${k==='sl'?4:''}" data-m="${mutants.indexOf(m)}" data-k="${k}"></label>`).join("");
    box.appendChild(g);
  });
}
const sync=()=>box.querySelectorAll("input").forEach(inp=>{inp.value=FIELDS.find(x=>x[0]===inp.dataset.k)[2](mutants[+inp.dataset.m])});
box.oninput=e=>{const inp=e.target;FIELDS.find(x=>x[0]===inp.dataset.k)[3](mutants[+inp.dataset.m],+inp.value||0);draw()};
const preset=(hp,atk,sk)=>{mutants[0].hp=hp;mutants[0].attacks[0].atk=atk;mutants[0].attacks[0].val=sk;sync();draw()};
bNorm.onclick=()=>{mutants.forEach((m,i)=>Object.assign(m,JSON.parse(JSON.stringify(ORIG[i]))));sync();draw()};
bBig.onclick=()=>preset(100000000,2000000,350000);
bHuge.onclick=()=>preset(165000000000,2000000,12345678);
bLong.onclick=()=>{const L="Archimedes Thermodynamic Overlord";mutants[0].name=mutants[0].name===L?ORIG[0].name:L;buildInputs();sync();draw()};
const setGenes=n=>{const m=mutants[1],o=ORIG[1];m.skin=0;m.geneIcons=o.geneIcons.slice(0,n);m.attacks[1].icon=n===1?"neutral":o.attacks[1].icon;gen2.classList.toggle("on",n===2);gen1.classList.toggle("on",n===1);sync();draw()};   // 1 gen: el 2º ataque pasa a neutro, pero sigue existiendo
gen2.onclick=()=>setGenes(2);gen1.onclick=()=>setGenes(1);
document.querySelectorAll(".cnt").forEach(b=>b.onclick=()=>{COUNT=+b.dataset.n;document.querySelectorAll(".cnt").forEach(x=>x.classList.toggle("on",x===b));buildInputs();sync();draw()});
const setPal=p=>{PAL=p;document.body.dataset.pal=p;pRank.classList.toggle("on",p==="rank");pMut.classList.toggle("on",p==="mutant");draw()};
pRank.onclick=()=>setPal("rank");pMut.onclick=()=>setPal("mutant");
const setOrbs=on=>{useOrbs=on;oOn.classList.toggle("on",on);oOff.classList.toggle("on",!on);draw()};
oOn.onclick=()=>setOrbs(true);oOff.onclick=()=>setOrbs(false);
const setCmp=c=>{document.body.dataset.cmp=c;cOn.classList.toggle("on",c==="on");cOff.classList.toggle("on",c==="off");draw()};
cOn.onclick=()=>setCmp("on");cOff.onclick=()=>setCmp("off");
mutants.forEach(normalize);buildInputs();sync();draw();window.addEventListener("load",draw);if(document.fonts)document.fonts.ready.then(draw);   // re-mide los números cuando cargan las fuentes
</script>
</body>
</html>
